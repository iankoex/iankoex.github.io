baseurl: "" # the subpath of your site, e.g. blog/
url: "https://blog.iankoex.com" # the base hostname & protocol for your site, e.g. http://example.com/

title: Exit Code Zero | iankoex
description: Exit Code Zero is all about the pursuit of the elusive exit code 0. Here, I’ll share insights from my projects, the challenges I face, and the solutions I discover along the way.

# Scss Directory
sass:
  sass_dir: assets/scss
  style: compressed

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll/tagging
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 100
paginate_path: "/page/:num"

# include
include:
  - _pages
  - _authors

# Pages Path
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext

  - scope:
      path: "_authors"
    values:
      permalink: /author/:basename:output_ext
      layout: author

  - scope:
      path: ""
      type: "posts"
    values:
      permalink: post/:title:output_ext
      layout: post

# Tags
tag_page_dir: tag
tag_page_layout: tags
tag_permalink_style: pretty

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

author:
  twitter: iankoex