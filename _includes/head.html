<head>
    <meta charset="utf-8" />
    <title>{{ site.title }}</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta
        name="description"
        content="{%if page.description%}{{page.description}}{%else%}{{site.description}}{%endif%}"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="iankoex" />
    <meta name="twitter:title" content="{{ site.title }}" />
    <meta
        name="twitter:description"
        content="{%if page.description%}{{page.description}}{%else%}{{site.description}}{%endif%}"
    />
    <meta name="twitter:image" content="/assets/images/logo.png" />

    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{ site.title }}" />
    <meta
        property="og:description"
        content="{%if page.description%}{{page.description}}{%else%}{{site.description}}{%endif%}"
    />
    <meta property="og:url" content="{{ site.url }}" />
    <meta property="og:image" content="/assets/images/logo.png" />

    <!-- theme meta -->
    <meta name="theme-name" content="northendlab-jekyll" />

    {% if site.author %}
    <meta name="author" content="{{ . }}" />
    {% endif %} {% for css in site.data.plugins.css %}
    <link rel="stylesheet" href="{{ css | relative_url }}" />
    {% endfor %}

    <!-- Main Stylesheet -->
    <link
        href="{{ '/assets/scss/style.css' | relative_url }}"
        rel="stylesheet"
    />

    <!--Favicon-->
    <link
        rel="shortcut icon"
        href="{{ '/assets/images/favicon.png' | relative_url }} "
        type="image/x-icon"
    />
    <link
        rel="icon"
        href="{{ '/assets/images/favicon.png' | relative_url }} "
        type="image/x-icon"
    />
</head>
