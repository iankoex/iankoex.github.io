<head>
    <meta charset="utf-8" />
    <title>{{ site.title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

    {% seo %}
    <!-- theme meta -->
    <meta name="theme-name" content="northendlab-jekyll" />

    {% if site.author %}
    <meta name="author" content="{{ . }}" />
    {% endif %} {% for css in site.data.plugins.css %}
    <link rel="stylesheet" href="{{ css | relative_url }}" />
    {% endfor %}

    <!-- Main Stylesheet -->
    <link href="{{ site.url }}{{ '/assets/scss/style.css' | relative_url }}" rel="stylesheet" />

    <!--Favicon-->
    <link rel="shortcut icon" href="{{ site.url }}{{ site.data.parameters.favicon }}" type="image/x-icon" />
    <link rel="icon" href="{{ site.url }}{{ site.data.parameters.favicon }}" type="image/x-icon" />
</head>
